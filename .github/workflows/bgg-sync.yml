name: BGG Sync

on:
  schedule:
    # 0 6 * * * 是 UTC 時間早上 6 點，也就是台灣時間的「下午 2 點」執行。
    # 如果你想改在台灣時間「凌晨 2 點」執行，可以改成 cron: "0 18 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run sync:bgg
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          BGG_USERNAME: ${{ secrets.BGG_USERNAME }}
          # 👇 必須補上這行，把突破防火牆的鑰匙交給雲端腳本
          BGG_AUTH_VALUE: ${{ secrets.BGG_AUTH_VALUE }}